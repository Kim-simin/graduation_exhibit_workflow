<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Playwright MCP Verification Test Page</title>
  <style>
    body { font-family: sans-serif; margin: 20px; line-height: 1.6; }
    .box { height: 800px; background: #f0f4f8; padding: 20px; margin: 20px 0; border: 1px solid #cbd5e1; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #2563eb; color: white; border: none; border-radius: 6px; }
    #status { margin-top: 10px; font-weight: bold; color: #059669; }
  </style>
</head>
<body>
  <h1>Playwright MCP Automated Verification Page</h1>
  <p>이 페이지는 Playwright MCP의 탐색, 클릭, 스크롤, 스크린샷 기능을 검증하기 위한 로컬 테스트 페이지입니다.</p>
  
  <button id="test-btn" onclick="handleClick()">테스트 버튼 클릭</button>
  <div id="status">대기 중...</div>

  <div class="box">
    <h3>스크롤 영역 1</h3>
    <p>중간 콘텐츠입니다. 스크롤 동작을 테스트합니다.</p>
  </div>

  <div class="box" id="bottom-target">
    <h3>하단 타깃 영역</h3>
    <p id="scroll-result">하단 도달 완료!</p>
  </div>

  <script>
    let clicked = false;
    function handleClick() {
      clicked = true;
      document.getElementById('status').innerText = '버튼 클릭 성공 (Clicked!)';
      document.getElementById('test-btn').innerText = '클릭됨';
    }
  </script>
</body>
</html>
